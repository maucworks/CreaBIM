name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Webview libraries
        if: runner.os == 'Linux'
        # a mirror can lag behind its index (404 on a just-updated package):
        # refresh and try again before failing
        run: |
          pkgs="libwebkit2gtk-4.1-dev libgtk-3-dev"
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing $pkgs && exit 0
            echo "apt attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Provision embedded Python
        # creabim-script links the bundled libpython (never a system one):
        # download+verify first, then point PyO3 at it for every later step.
        run: |
          cargo run -p creabim-provision
          HOME_DIR="${{ runner.temp }}/creabim-python/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PYO3_PYTHON=$HOME_DIR/python.exe" >> $GITHUB_ENV
            echo "$HOME_DIR" >> $GITHUB_PATH
            echo "$HOME_DIR/DLLs" >> $GITHUB_PATH
          else
            echo "PYO3_PYTHON=$HOME_DIR/bin/python3.13" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$HOME_DIR/lib" >> $GITHUB_ENV
          fi
        env:
          CREABIM_PYTHON_HOME: ${{ runner.temp }}/creabim-python
        shell: bash
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  ifc:
    name: IFC export validates in IfcOpenShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ifcopenshell pytest pypdf jsonschema
      - run: cargo run -q -p creabim-cli -- sample house.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc house.creabim.json house.ifc
      - run: python tools/validate_ifc.py house.ifc
      - run: cargo run -q -p creabim-cli -- sample-simple simple.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc simple.creabim.json simple.ifc
      - run: python tools/validate_ifc.py simple.ifc
      - run: cargo run -q -p creabim-cli -- sample-layered layered.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc layered.creabim.json layered.ifc
      - run: python tools/validate_ifc.py layered.ifc
      - run: cargo run -q -p creabim-cli -- sample-typed typed.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc typed.creabim.json typed.ifc
      - run: python tools/validate_ifc.py typed.ifc
      - run: cargo run -q -p creabim-cli -- sample-furnished furnished.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc furnished.creabim.json furnished.ifc
      - run: python tools/validate_ifc.py furnished.ifc
      - run: cargo run -q -p creabim-cli -- sample-garden garden.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc garden.creabim.json garden.ifc
      - run: python tools/validate_ifc.py garden.ifc
      - run: cargo run -q -p creabim-cli -- plan house.creabim.json "Ground Floor" ground-floor.svg
      - run: cargo run -q -p creabim-cli -- view house.creabim.json "Section A-A" section-a.svg
      - run: cargo run -q -p creabim-cli -- view house.creabim.json "South Elevation" south-elevation.svg
      - run: cargo run -q -p creabim-cli -- pdf house.creabim.json house.pdf
      - run: cargo run -q -p creabim-cli -- schedule house.creabim.json windows windows.csv
      - run: cargo run -q -p creabim-cli -- schedule house.creabim.json rooms rooms.csv
      - run: cargo run -q -p creabim-cli -- check house.creabim.json
      - name: PDF opens with a page per sheet
        run: python -c "import pypdf; r = pypdf.PdfReader('house.pdf', strict=True); n = len(r.pages); print(n, 'pages'); assert n == 13; assert 'ROOM SCHEDULE' in r.pages[11].extract_text().upper(); assert 'Ground Floor Plan' in r.pages[1].extract_text(); assert 'DOOR SCHEDULE' in r.pages[9].extract_text(); assert 'DETAIL' in r.pages[8].extract_text().upper()"
      - name: The JSON model format builds, exports and validates against its schema
        run: |
          cargo run -q -p creabim-cli -- build --check examples/small-house.json
          cargo run -q -p creabim-cli -- build examples/small-house.json small-house.creabim
          cargo run -q -p creabim-cli -- pdf small-house.creabim small-house.pdf
          cargo run -q -p creabim-cli -- ifc small-house.creabim small-house.ifc
          python tools/validate_ifc.py small-house.ifc
          cargo run -q -p creabim-cli -- export-json small-house.creabim small-house-export.json
          cargo run -q -p creabim-cli -- build small-house-export.json small-house-2.creabim
          cargo run -q -p creabim-cli -- export-json small-house-2.creabim small-house-export-2.json
          cmp small-house-export.json small-house-export-2.json
          python tools/validate_model_json.py examples/small-house.json small-house-export.json
          python -c "import pypdf; r = pypdf.PdfReader('small-house.pdf', strict=True); assert len(r.pages) == 3"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-exports
          path: |
            house.ifc
            ground-floor.svg
            section-a.svg
            south-elevation.svg
            house.pdf
            windows.csv
            small-house.pdf

  windows-build:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p creabim-app -p creabim-cli
      - uses: actions/upload-artifact@v4
        with:
          name: creabim-windows
          path: |
            target/release/creabim-app.exe
            target/release/creabim.exe
